<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#22c55e" />

    <link rel="icon" type="image/svg+xml" href="./src/assets/images/landing/dashboard.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />

    <title>Airfinance - Transforme sua vida financeira com inteligência</title>
    <meta
      name="description"
      content="O Airfinance revoluciona a forma como você gerencia seu dinheiro, oferecendo insights poderosos e uma experiência única de controle financeiro."
    />
  </head>
  <body>
    <div id="root"></div>
    <!--
      Early recovery when a deploy invalidates hashed chunks.
      Runs before the module graph; covers entry 404s that React never sees.
    -->
    <script>
      (function () {
        var KEY = 'airfinance:chunk-reload-once';
        var PATTERN =
          /Failed to fetch dynamically imported module|Importing a module script failed|error loading dynamically imported module|Loading chunk [\w-]+ failed|ChunkLoadError|Unable to preload CSS/i;

        function recover(msg) {
          try {
            if (!PATTERN.test(String(msg || ''))) return;
            if (sessionStorage.getItem(KEY) === '1') return;
            sessionStorage.setItem(KEY, '1');
            var url = new URL(location.href);
            url.searchParams.set('_chunk', String(Date.now()));
            location.replace(url.pathname + url.search + url.hash);
          } catch (e) {}
        }

        window.addEventListener(
          'error',
          function (e) {
            recover((e && e.message) || (e && e.error && e.error.message));
          },
          true,
        );
        window.addEventListener('unhandledrejection', function (e) {
          var reason = e && e.reason;
          recover((reason && reason.message) || reason);
        });
        window.addEventListener('vite:preloadError', function (e) {
          e.preventDefault();
          recover('Failed to fetch dynamically imported module');
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
