openapi: 3.0.3
info:
  title: Complete Financial Plan (fragment)
  version: 1.0.0
paths:
  /meu-financeiro/v1/companies/{companyId}/decision-engine/complete-plan:
    post:
      tags: [DecisionEngine]
      summary: Plano financeiro completo (determinístico + narrativa LLM com cache)
      parameters:
        - in: path
          name: companyId
          required: true
          schema: { type: string }
        - in: query
          name: referencePeriod
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
            example: '2026-05'
      responses:
        '200':
          description: Plano completo gerado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompletePlanResponse'
        '400':
          description: referencePeriod inválido
        '401':
          description: Não autenticado
        '403':
          description: Sem permissão para esta empresa
components:
  schemas:
    Status:
      type: string
      enum: [healthy, attention, critical]
    ThemePhase:
      type: string
      nullable: true
      enum: [red, yellow, green]
    InstallmentPriority:
      type: string
      enum: [high, medium, low]
    InstallmentAccountType:
      type: string
      enum: [credit_card, other]
    Numbers:
      type: object
      required: [netIncome, totalCommitted, committedPct, healthyTargetPct, reductionNeeded]
      properties:
        netIncome: { type: number }
        totalCommitted: { type: number }
        committedPct: { type: number, description: '0..1' }
        healthyTargetPct: { type: number }
        reductionNeeded: { type: number }
    ProjectionStep:
      type: object
      required: [totalCommitted, committedPct, installmentsEnding]
      properties:
        totalCommitted: { type: number }
        committedPct: { type: number }
        installmentsEnding: { type: integer }
    Projection:
      type: object
      required: [in30Days, in60Days, in90Days, ifNoChange]
      properties:
        in30Days: { $ref: '#/components/schemas/ProjectionStep' }
        in60Days: { $ref: '#/components/schemas/ProjectionStep' }
        in90Days: { $ref: '#/components/schemas/ProjectionStep' }
        ifNoChange: { type: string }
    InstallmentItem:
      type: object
      required: [description, monthlyValue, remaining, endDate, accountId, accountType, priority]
      properties:
        description: { type: string }
        monthlyValue: { type: number }
        remaining: { type: integer }
        endDate: { type: string, example: '2027-01-05' }
        accountId: { type: string }
        accountType: { $ref: '#/components/schemas/InstallmentAccountType' }
        categoryId: { type: string, nullable: true }
        priority: { $ref: '#/components/schemas/InstallmentPriority' }
    InstallmentsStrategy:
      type: object
      required: [items, suggestion]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/InstallmentItem' }
        suggestion: { type: string }
    Category:
      type: object
      required: [name, amount, share]
      properties:
        name: { type: string }
        amount: { type: number }
        share: { type: number }
    Behavior:
      type: object
      required: [topCategories, peakDaysOfMonth, creditUtilizationTrend]
      properties:
        topCategories:
          type: array
          items: { $ref: '#/components/schemas/Category' }
        peakDaysOfMonth:
          type: array
          nullable: true
          items: { type: integer, minimum: 1, maximum: 31 }
        creditUtilizationTrend:
          type: 'null'
    VariableSpending:
      type: object
      required:
        - bucketHealth
        - totalVariable
        - previousTotalVariable
        - percentOfIncome
        - monthOverMonthChangePct
        - topCategories
        - peakDaysOfMonth
      properties:
        bucketHealth:
          $ref: '#/components/schemas/Status'
          description: Saúde do bucket variável (não é o status do motor evaluate-auto).
        totalVariable: { type: number }
        previousTotalVariable: { type: number }
        percentOfIncome:
          type: number
          nullable: true
          description: Proporção 0..1 sobre a mesma base de renda do período (summary.income).
        monthOverMonthChangePct:
          type: number
          nullable: true
          description: Variação % total variável vs mês anterior.
        topCategories:
          type: array
          items: { $ref: '#/components/schemas/Category' }
        peakDaysOfMonth:
          type: array
          nullable: true
          items: { type: integer, minimum: 1, maximum: 31 }
    Rule:
      type: object
      required: [id, text, rationale]
      properties:
        id: { type: string }
        text: { type: string }
        rationale: { type: string }
    CompletePlanResponse:
      type: object
      required:
        - status
        - primary_issue
        - theme_phase
        - diagnosis
        - coherenceNote
        - numbers
        - projection
        - installmentsStrategy
        - behavior
        - variableSpending
        - personalRules
        - simpleRule
        - expectedOutcome
        - llmCached
        - referencePeriod
        - generatedAt
      properties:
        status: { $ref: '#/components/schemas/Status' }
        primary_issue: { type: string }
        theme_phase: { $ref: '#/components/schemas/ThemePhase' }
        diagnosis: { type: string }
        coherenceNote: { type: string }
        numbers: { $ref: '#/components/schemas/Numbers' }
        projection: { $ref: '#/components/schemas/Projection' }
        installmentsStrategy: { $ref: '#/components/schemas/InstallmentsStrategy' }
        behavior: { $ref: '#/components/schemas/Behavior' }
        variableSpending: { $ref: '#/components/schemas/VariableSpending' }
        personalRules:
          type: array
          items: { $ref: '#/components/schemas/Rule' }
        simpleRule: { type: string }
        expectedOutcome: { type: string }
        llmCached: { type: boolean }
        referencePeriod: { type: string, example: '2026-05' }
        generatedAt: { type: string, format: date-time }
        ruleEngineVersion: { type: string }
